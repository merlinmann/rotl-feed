name: ROTL feed health

# Verifies the LIVE feed (FeedBurner + Pages) is 200, valid XML, and complete.
# A failed run makes GitHub email the repo owner -- the alert, no local machine needed.
# Runs hourly and on demand. FeedBurner gets a 90-minute polling grace in
# healthcheck.py; a stale enclosure catalog fails once that window closes.

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      refresh_updater:
        description: Request and verify an updater run even if the heartbeat is fresh
        type: boolean
        default: false

permissions:
  contents: read
  actions: write  # request a refresh when scheduled updater runs are overdue

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test feed checks
        run: python3 -m unittest -v
      - name: Check live feed health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROTL_RECOVER_UPDATER: "true"
          ROTL_REFRESH_UPDATER: ${{ inputs.refresh_updater == true && 'true' || 'false' }}
        run: python3 healthcheck.py
